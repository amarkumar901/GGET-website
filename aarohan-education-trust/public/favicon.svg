<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Aarohan">
  <rect width="32" height="32" rx="6" fill="#1B2A4A"/>
  <!-- Three chunky rising-sun rays -->
  <rect x="14.5" y="3.5" width="3" height="5.5" rx="1.4" fill="#C9842A"/>
  <rect x="14.5" y="3.5" width="3" height="5.5" rx="1.4" fill="#C9842A" transform="rotate(-48 16 16)"/>
  <rect x="14.5" y="3.5" width="3" height="5.5" rx="1.4" fill="#C9842A" transform="rotate(48 16 16)"/>
  <!-- Sun disk; book covers the lower half so it reads as a rising sun -->
  <circle cx="16" cy="16" r="6.2" fill="#C9842A"/>
  <!-- Open book: two cream pages meeting at a raised spine -->
  <path d="M4.5 19.5 L16 16.2 L16 26.2 L6 28 Z" fill="#F7F1E8"/>
  <path d="M27.5 19.5 L16 16.2 L16 26.2 L26 28 Z" fill="#E8DFD0"/>
</svg>
